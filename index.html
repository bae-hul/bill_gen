<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Generator</title>
    <!-- Import pdf-lib via CDN -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #111827;
            margin-top: 0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        input {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }
        input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <h2>Generate Bills</h2>
    
    <div class="input-group">
        <input type="text" id="bill1" placeholder="Bill 1 Number (e.g., 2147)" maxlength="4">
        <input type="text" id="bill2" placeholder="Bill 2 Number (e.g., 5768)" maxlength="4">
        <input type="text" id="bill3" placeholder="Bill 3 Number" maxlength="4">
        <input type="text" id="bill4" placeholder="Bill 4 Number" maxlength="4">
    </div>
    
    <button onclick="generatePDF()">Download Generated PDF</button>

    <script>
        async function generatePDF() {
            if (!window.PDFLib) {
                alert("PDF-lib library failed to load.");
                return;
            }

            const { PDFDocument, rgb } = PDFLib;

            const bill1 = document.getElementById('bill1').value || '';
            const bill2 = document.getElementById('bill2').value || '';
            const bill3 = document.getElementById('bill3').value || '';
            const bill4 = document.getElementById('bill4').value || '';

            try {
                const url = 'master.pdf'; 
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error("Could not find 'master.pdf'. Make sure it is uploaded to the same folder.");
                }
                
                const existingPdfBytes = await response.arrayBuffer();
                const pdfDoc = await PDFDocument.load(existingPdfBytes);
                
                const pages = pdfDoc.getPages();
                const firstPage = pages[0];

                // --- UPDATED CALCULATIONS ---
                const textSize = 24; 
                const textColor = rgb(0.85, 0.1, 0.1); // A slightly deeper red to match the stamp ink look

                // X is shifted right to clear the blue box
                // Y is spaced ~210 points apart for a standard 842pt tall A4 page
                firstPage.drawText(bill1, { x: 360, y: 730, size: textSize, color: textColor });
                firstPage.drawText(bill2, { x: 360, y: 520, size: textSize, color: textColor });
                firstPage.drawText(bill3, { x: 360, y: 310, size: textSize, color: textColor });
                firstPage.drawText(bill4, { x: 360, y: 100, size: textSize, color: textColor });

                const pdfBytes = await pdfDoc.save();

                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "Generated_Bills.pdf";
                document.body.appendChild(link);
                link.click();
                
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

            } catch (error) {
                console.error(error);
                alert("Error generating PDF: " + error.message);
            }
        }
    </script>
</body>
</html>
