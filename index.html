<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Number Stamper — Sai Abhay Petroleum</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root {
    --ink: #1a2f6e;        /* bill blue */
    --ink-soft: #45518a;
    --stamp: #d21422;      /* the red number */
    --paper: #f6f5f1;
    --card: #ffffff;
    --line: #d9d8d2;
    --ok: #1d7a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap {
    max-width: 1060px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header { margin-bottom: 26px; }
  header h1 {
    font-size: 1.45rem;
    letter-spacing: 0.02em;
  }
  header h1 .red { color: var(--stamp); }
  header p { color: var(--ink-soft); margin-top: 4px; font-size: 0.92rem; }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 26px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
  }
  .panel h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .grid6 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 14px;
  }
  .cell label {
    display: block;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
    letter-spacing: 0.03em;
  }
  .cell input {
    width: 100%;
    padding: 10px 10px;
    font-size: 1.25rem;
    font-family: "Consolas", "Menlo", monospace;
    font-weight: 700;
    color: var(--stamp);
    letter-spacing: 0.14em;
    text-align: center;
    border: 1.5px solid var(--line);
    border-radius: 7px;
    background: #fffdf8;
    outline: none;
    transition: border-color .15s;
  }
  .cell input:focus { border-color: var(--ink); }
  .cell input.bad { border-color: var(--stamp); background: #fff2f2; }

  .actions { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  button.generate {
    width: 100%;
    padding: 13px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #fff;
    background: var(--ink);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  button.generate:hover { background: #12235a; }
  button.generate:active { transform: translateY(1px); }
  button.generate:disabled { background: #9aa2c4; cursor: not-allowed; }
  button.clear {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: underline;
  }
  .msg { font-size: 0.85rem; min-height: 1.2em; }
  .msg.err { color: var(--stamp); }
  .msg.ok { color: var(--ok); }

  .preview-panel { padding: 14px; }
  .preview-panel h2 { padding: 6px 6px 0; }
  #preview {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
  }
  .hint { font-size: 0.78rem; color: var(--ink-soft); margin-top: 8px; padding: 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bill Number Stamper <span class="red">— Sai Abhay Petroleum</span></h1>
    <p>Enter up to 6 four-digit bill numbers. Blank slots stay unstamped. The preview updates as you type.</p>
  </header>

  <div class="layout">
    <div class="panel">
      <h2>Bill numbers</h2>
      <div class="grid6">
        <div class="cell"><label for="n0">1 · Top left</label><input id="n0" inputmode="numeric" maxlength="4" placeholder="····"></div>
        <div class="cell"><label for="n1">2 · Top right</label><input id="n1" inputmode="numeric" maxlength="4" placeholder="····"></div>
        <div class="cell"><label for="n2">3 · Middle left</label><input id="n2" inputmode="numeric" maxlength="4" placeholder="····"></div>
        <div class="cell"><label for="n3">4 · Middle right</label><input id="n3" inputmode="numeric" maxlength="4" placeholder="····"></div>
        <div class="cell"><label for="n4">5 · Bottom left</label><input id="n4" inputmode="numeric" maxlength="4" placeholder="····"></div>
        <div class="cell"><label for="n5">6 · Bottom right</label><input id="n5" inputmode="numeric" maxlength="4" placeholder="····"></div>
      </div>
      <div class="actions">
        <button class="generate" id="btnGen">Generate PDF</button>
        <button class="clear" id="btnClear">Clear all</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div class="panel preview-panel">
      <h2>Preview</h2>
      <canvas id="preview"></canvas>
      <div class="hint">Preview is the exact final page: numbers are baked into the scan itself (not selectable text in the PDF).</div>
    </div>
  </div>
</div>

// ---- Stamp positions ----
// Measured in pixels on a 100-dpi render of the page (origin top-left).
// x = left edge of the number, y = text baseline,
// tilt = each bill's own scan skew in degrees (clockwise), measured from
// its table borders and Date/Time lines, so the number leans with its bill.
const POS_100DPI = [
  { x: 246, y: 81,  tilt: 0.25 },  // 1 top left
  { x: 646, y: 71,  tilt: 0.31 },  // 2 top right
  { x: 251, y: 422, tilt: 0.26 },  // 3 middle left
  { x: 651, y: 426, tilt: 0.32 },  // 4 middle right
  { x: 218, y: 755, tilt: 0.29 },  // 5 bottom left
  { x: 637, y: 774, tilt: 0.17 },  // 6 bottom right
];
const FONT_PT = 14.5;                 // PDF font size in points
const PAGE_W = 595.28, PAGE_H = 841.89;   // A4 in points
const PX_TO_PT = 72 / 100;          // 100-dpi pixels -> points

const inputs = [...Array(6)].map((_, i) => document.getElementById('n' + i));
const msg = document.getElementById('msg');
const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');

// Template image for the preview canvas
const tplImg = new Image();
tplImg.onload = () => { canvas.width = tplImg.width; canvas.height = tplImg.height; drawPreview(); };
tplImg.src = "data:image/jpeg;base64," + TEMPLATE_B64;

function values() { return inputs.map(el => el.value.trim()); }

function drawPreview() {
  if (!tplImg.complete || !tplImg.width) return;
  ctx.drawImage(tplImg, 0, 0);
  const scale = tplImg.width / 827;   // 827 px = page width at 100 dpi
  const fontPx = FONT_PT / PX_TO_PT * scale;
  values().forEach((v, i) => {
    if (v) stampScuffed(POS_100DPI[i], v, scale, fontPx);
  });
}

// Draws one number baked into the canvas with a scanned-ink look:
// rendered at 3x and downscaled (soft edges), alpha lightly blurred,
// ink coverage mottled with noise + rare dropouts, then composited
// as red ink over the page pixels. No text objects survive to the PDF.
function stampScuffed(p, text, scale, fontPx) {
  const pad = 30, w0 = 220, h0 = 80, base = 56;   // work-tile geometry (canvas px)

  // 1. crisp text at 3x
  const off = document.createElement('canvas');
  off.width = w0 * 3; off.height = h0 * 3;
  const o = off.getContext('2d');
  o.translate(pad * 3, base * 3);
  o.rotate(p.tilt * Math.PI / 180);
  o.fillStyle = '#fff';
  o.font = `bold ${fontPx * 3}px Helvetica, Arial, sans-serif`;
  o.textBaseline = 'alphabetic';
  o.fillText(text, 0, 0);

  // 2. downscale -> scanner-soft coverage mask
  const small = document.createElement('canvas');
  small.width = w0; small.height = h0;
  const s = small.getContext('2d');
  s.imageSmoothingEnabled = true;
  s.imageSmoothingQuality = 'high';
  s.drawImage(off, 0, 0, w0, h0);
  const mask = s.getImageData(0, 0, w0, h0);

  // alpha -> float coverage
  const N = w0 * h0;
  let a = new Float32Array(N);
  for (let i = 0; i < N; i++) a[i] = mask.data[i * 4 + 3] / 255;

  // 3. light separable blur [0.25 0.5 0.25], horizontal then vertical
  const tmp = new Float32Array(N);
  for (let y = 0; y < h0; y++) for (let x = 0; x < w0; x++) {
    const i = y * w0 + x;
    const l = x > 0 ? a[i - 1] : 0, r = x < w0 - 1 ? a[i + 1] : 0;
    tmp[i] = 0.25 * l + 0.5 * a[i] + 0.25 * r;
  }
  for (let y = 0; y < h0; y++) for (let x = 0; x < w0; x++) {
    const i = y * w0 + x;
    const u = y > 0 ? tmp[i - w0] : 0, d = y < h0 - 1 ? tmp[i + w0] : 0;
    a[i] = 0.25 * u + 0.5 * tmp[i] + 0.25 * d;
  }

  // 4. ink mottle + rare dropouts
  for (let i = 0; i < N; i++) {
    if (a[i] === 0) continue;
    // approx gaussian(1, 0.10) clamped
    let n = 1 + (Math.random() + Math.random() + Math.random() - 1.5) * 0.163;
    n = Math.min(1.1, Math.max(0.72, n));
    a[i] = Math.min(1, a[i] * n);
    if (Math.random() < 0.006) a[i] *= 0.55;
  }

  // 5. composite red ink over the page pixels
  const px0 = Math.round(p.x * scale) - pad;
  const py0 = Math.round(p.y * scale) - base;
  const region = ctx.getImageData(px0, py0, w0, h0);
  const d = region.data;
  for (let i = 0; i < N; i++) {
    const cov = a[i];
    if (cov <= 0.003) continue;
    const j = i * 4;
    const rInk = 203 + (Math.random() + Math.random() - 1) * 7.3;
    d[j]     = d[j]     * (1 - cov) + rInk * cov;
    d[j + 1] = d[j + 1] * (1 - cov) + 24   * cov;
    d[j + 2] = d[j + 2] * (1 - cov) + 34   * cov;
  }
  ctx.putImageData(region, px0, py0);
}

function validate() {
  let anyFilled = false, allValid = true;
  inputs.forEach(el => {
    const v = el.value.trim();
    const ok = v === "" || /^\d{4}$/.test(v);
    el.classList.toggle('bad', !ok);
    if (v !== "") anyFilled = true;
    if (!ok) allValid = false;
  });
  return { anyFilled, allValid };
}

inputs.forEach(el => {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g, '').slice(0, 4);
    validate();
    drawPreview();
    msg.textContent = "";
    msg.className = "msg";
  });
});

document.getElementById('btnClear').addEventListener('click', () => {
  inputs.forEach(el => { el.value = ""; el.classList.remove('bad'); });
  drawPreview();
  msg.textContent = "";
  msg.className = "msg";
});

document.getElementById('btnGen').addEventListener('click', async () => {
  const { anyFilled, allValid } = validate();
  if (!allValid) { msg.textContent = "Each number must be exactly 4 digits (or left blank)."; msg.className = "msg err"; return; }
  if (!anyFilled) { msg.textContent = "Enter at least one bill number."; msg.className = "msg err"; return; }

  const btn = document.getElementById('btnGen');
  btn.disabled = true; btn.textContent = "Generating…";
  try {
    const { PDFDocument } = PDFLib;

    // The preview canvas IS the page: numbers are baked into the image
    // pixels, so the PDF contains a single flat JPEG and no text objects.
    drawPreview();
    const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
    const jpgBytes = Uint8Array.from(atob(dataUrl.split(',')[1]), c => c.charCodeAt(0));

    const pdf = await PDFDocument.create();
    const page = pdf.addPage([PAGE_W, PAGE_H]);
    const jpg = await pdf.embedJpg(jpgBytes);
    page.drawImage(jpg, { x: 0, y: 0, width: PAGE_W, height: PAGE_H });

    const bytes = await pdf.save();
    const filled = values().filter(Boolean);
    const name = "bills_" + filled.join("-") + ".pdf";
    const blob = new Blob([bytes], { type: "application/pdf" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
    msg.textContent = "PDF downloaded: " + name;
    msg.className = "msg ok";
  } catch (e) {
    msg.textContent = "Something went wrong generating the PDF: " + e.message;
    msg.className = "msg err";
  } finally {
    btn.disabled = false; btn.textContent = "Generate PDF";
  }
});
</script>
